# Holster configuration
# Docs: https://github.com/impelcrypto/Holster (see README)
#
# providers: any OpenAI-compatible endpoint (CLIProxyAPI, Ollama, OpenAI, ...)

providers:
  cliproxy:
    base_url: http://127.0.0.1:8317/v1
    api_key: ""            # only for CLI/dev; the app uses macOS Keychain
  ollama:
    base_url: http://127.0.0.1:11434/v1
  # opencode-go:           # https://opencode.ai/docs/go/
  #   base_url: https://opencode.ai/zen/go/v1
  #   api_key: ""
  # gemini:                # Google Gemini API via its OpenAI-compatible endpoint
  #   base_url: https://generativelanguage.googleapis.com/v1beta/openai
  #   api_key: ""
  # custom:                # any OpenAI-compatible endpoint, e.g. OpenRouter
  #   base_url: https://openrouter.ai/api/v1
  #   api_key: ""

default_provider: cliproxy

# TTS. Three modes:
#   provider: edge         -> free Microsoft Edge voices, no API key. The text
#                             you speak goes to Microsoft (voice is an Edge name
#                             like en-US-AvaMultilingualNeural)
#   base_url set           -> OpenAI-compatible /audio/speech (voice e.g. alloy)
#   provider: system       -> built-in macOS voice, nothing leaves the Mac (voice
#                             is a macOS name or identifier like Ava; premium
#                             voices download in System Settings > Accessibility)
tts:
  provider: edge
  voice: en-US-AvaMultilingualNeural
  # base_url: ""           # for an OpenAI-compatible endpoint instead of edge
  # api_key: ""
  # model: gpt-4o-mini-tts

commands:
  - name: Grammar Teacher
    hotkey: cmd+shift+g    # modifiers: cmd, shift, opt, ctrl
    prompt: grammar.md     # file under prompts/, {selection} gets replaced
    provider: cliproxy
    model: gpt-5.6-sol
    # reasoning: medium    # low / medium / high; omit to send no reasoning field
    # fallback_provider: ollama   # used when the provider fails before any output
    # fallback_model: qwen3:8b    # omit to reuse the primary model
