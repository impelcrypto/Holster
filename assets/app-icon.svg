<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Dimensional leather holster and revolver macOS icon</title>
  <desc id="desc">A clearly shaped, dimensional side-profile revolver being drawn upward from a stitched leather holster on a deep blue squircle.</desc>

  <defs>
    <radialGradient id="bg4" cx="40%" cy="20%" r="92%">
      <stop offset="0" stop-color="#2158B8"/>
      <stop offset="0.48" stop-color="#0B347C"/>
      <stop offset="1" stop-color="#061841"/>
    </radialGradient>
    <linearGradient id="leather4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB257"/>
      <stop offset="0.32" stop-color="#E77D2C"/>
      <stop offset="0.72" stop-color="#B3481E"/>
      <stop offset="1" stop-color="#76231A"/>
    </linearGradient>
    <linearGradient id="leatherEdge4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#BD4A20"/>
      <stop offset="1" stop-color="#541A1A"/>
    </linearGradient>
    <linearGradient id="leatherInside4" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#68221D"/>
      <stop offset="1" stop-color="#24111B"/>
    </linearGradient>
    <linearGradient id="steelSide4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8FFFF"/>
      <stop offset="0.45" stop-color="#BFD8DD"/>
      <stop offset="1" stop-color="#6F929D"/>
    </linearGradient>
    <linearGradient id="steelTop4" x1="0" y1="0" x2="1" y2="0.7">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.62" stop-color="#D9EEF1"/>
      <stop offset="1" stop-color="#93B5BE"/>
    </linearGradient>
    <linearGradient id="steelDark4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#789CA6"/>
      <stop offset="1" stop-color="#345765"/>
    </linearGradient>
    <linearGradient id="wood4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A84F29"/>
      <stop offset="0.46" stop-color="#6D291F"/>
      <stop offset="1" stop-color="#351923"/>
    </linearGradient>
    <radialGradient id="brass4" cx="34%" cy="28%" r="74%">
      <stop offset="0" stop-color="#FFF4A8"/>
      <stop offset="0.42" stop-color="#EEC05D"/>
      <stop offset="1" stop-color="#855017"/>
    </radialGradient>
    <filter id="objectShadow4" x="-35%" y="-35%" width="190%" height="200%">
      <feDropShadow dx="8" dy="24" stdDeviation="20" flood-color="#020A1E" flood-opacity="0.62"/>
    </filter>
    <filter id="gunShadow4" x="-40%" y="-45%" width="200%" height="220%">
      <feDropShadow dx="7" dy="13" stdDeviation="10" flood-color="#020915" flood-opacity="0.7"/>
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#1CCBFF" flood-opacity="0.38"/>
    </filter>
    <filter id="flapShadow4" x="-50%" y="-50%" width="220%" height="230%">
      <feDropShadow dx="7" dy="12" stdDeviation="8" flood-color="#3B1119" flood-opacity="0.55"/>
    </filter>
    <clipPath id="gunPeek4" clipPathUnits="userSpaceOnUse">
      <path d="M150 70h700v400H720c-70 0-130-20-190-40-90-30-180-25-240 0-50 20-90 38-140 40V70Z"/>
    </clipPath>
  </defs>

  <!-- macOS squircle -->
  <path fill="url(#bg4)" d="M226 36h572c105 0 190 85 190 190v572c0 105-85 190-190 190H226C121 988 36 903 36 798V226C36 121 121 36 226 36Z"/>
  <path fill="none" stroke="#3472CA" stroke-opacity="0.46" stroke-width="4" d="M229 39h566c104 0 188 84 188 188v568c0 104-84 188-188 188H229C125 983 41 899 41 795V227C41 123 125 39 229 39Z"/>

  <g filter="url(#objectShadow4)">
    <!-- Back rim and dark interior of the holster -->
    <path fill="url(#leatherEdge4)" d="M315 392c37-74 122-109 201-84l138 43c59 18 95 77 84 138l-19 105-389-105c-49-13-73-65-54-110l39 13Z"/>
    <path fill="url(#leatherInside4)" d="M330 388c36-52 103-75 165-56l145 45c43 13 69 56 61 100l-13 73-347-94c-37-10-54-52-34-84l23 16Z"/>
    <path fill="none" stroke="#FFB75C" stroke-width="15" stroke-linecap="round" d="M316 391c36-70 118-102 193-79l139 43c53 17 85 69 76 124"/>

    <!-- True side-profile revolver: individual faces create depth. -->
    <g clip-path="url(#gunPeek4)">
    <g transform="translate(940 0) scale(-1 1)">
    <g transform="translate(-10 72) rotate(152 520 410)" filter="url(#gunShadow4)">
      <!-- Wooden grip enters the holster -->
      <path fill="#251420" d="M401 417h121l-13 228c-2 35-31 62-66 62h-75c-29 0-49-29-39-56l72-234Z"/>
      <path fill="url(#wood4)" d="M413 421h99l-17 205c-2 27-24 48-51 48h-67c-20 0-34-20-27-39l63-214Z"/>
      <path fill="#C66E3D" fill-opacity="0.42" d="M430 441h21l-42 205h-27c-10 0-18-10-14-20l62-185Z"/>
      <path fill="none" stroke="#D58A57" stroke-opacity="0.55" stroke-width="6" stroke-linecap="round" d="M458 448c-10 55-16 115-18 176"/>
      <circle cx="442" cy="503" r="16" fill="url(#brass4)"/>

      <!-- Frame behind the cylinder -->
      <path fill="url(#steelDark4)" d="M414 308h177c30 0 55 25 55 55v78c0 31-25 56-56 56H423c-38 0-69-31-69-69v-52c0-37 23-62 60-68Z"/>
      <path fill="url(#steelSide4)" d="M421 294h168c28 0 51 23 51 51v71c0 30-24 54-54 54H427c-34 0-62-28-62-62v-50c0-34 22-58 56-64Z"/>
      <!-- Hammer and top strap -->
      <path fill="url(#steelTop4)" d="M430 278h165c23 0 41 18 41 41v17H406l24-58Z"/>

      <!-- Barrel: top, side, lower rib, and visible muzzle -->
      <path fill="url(#steelTop4)" d="M575 244h222l29 20-251 21v-41Z"/>
      <path fill="url(#steelSide4)" d="M568 270h237c20 0 36 16 36 36v42c0 20-16 36-36 36H568V270Z"/>
      <path fill="url(#steelDark4)" d="M568 360h241c13 0 24-6 32-15v21c0 20-16 36-36 36H568v-42Z"/>
      <ellipse cx="810" cy="327" rx="27" ry="48" fill="#3A5B67"/>
      <ellipse cx="807" cy="323" rx="18" ry="35" fill="#172E39"/>
      <ellipse cx="801" cy="312" rx="7" ry="14" fill="#8DB2BC" fill-opacity="0.68"/>
      <path fill="url(#steelTop4)" d="M670 222h67c12 0 22 10 22 22v12h-110v-13c0-12 9-21 21-21Z"/>

      <!-- Six-shot cylinder, axis, chambers, and front bevel -->
      <ellipse cx="493" cy="383" rx="82" ry="78" fill="#527582"/>
      <ellipse cx="480" cy="374" rx="78" ry="75" fill="url(#steelSide4)"/>
      <ellipse cx="480" cy="374" rx="62" ry="60" fill="#E5F4F5"/>
      <circle cx="480" cy="374" r="17" fill="#688D98"/>
      <circle cx="480" cy="333" r="9" fill="#6E96A1"/>
      <circle cx="515" cy="353" r="9" fill="#6E96A1"/>
      <circle cx="515" cy="395" r="9" fill="#6E96A1"/>
      <circle cx="480" cy="415" r="9" fill="#6E96A1"/>
      <circle cx="445" cy="395" r="9" fill="#6E96A1"/>
      <circle cx="445" cy="353" r="9" fill="#6E96A1"/>
      <path fill="none" stroke="#FFFFFF" stroke-opacity="0.62" stroke-width="7" stroke-linecap="round" d="M445 333c18-18 45-24 69-13"/>

      <!-- Trigger guard and trigger -->
      <path fill="none" stroke="url(#steelSide4)" stroke-width="20" stroke-linecap="round" d="M548 439c44-2 68 43 42 74-17 20-47 20-65 1"/>
      <path fill="none" stroke="#3D626E" stroke-width="9" stroke-linecap="round" d="M558 457c7 17 2 33-12 44"/>
      <path fill="none" stroke="#FFFFFF" stroke-opacity="0.48" stroke-width="4" stroke-linecap="round" d="M552 445c18-1 33 7 41 20"/>
      <!-- Small frame fastener -->
      <circle cx="581" cy="411" r="10" fill="#557A86"/>
      <circle cx="578" cy="408" r="4" fill="#D9ECEE"/>
    </g>
    </g>
    </g>

    <!-- Front shell hides the lower grip, making the revolver read as mid-draw. -->
    <path fill="url(#leatherEdge4)" d="M305 459c54-31 129-25 205 1l165 57-77 306c-18 72-80 124-154 130l-64 5c-65 5-121-46-124-111l-15-277c-3-54 21-91 64-111Z"/>
    <path fill="url(#leather4)" d="M292 444c54-28 124-20 196 5l157 54-70 294c-16 68-74 118-143 124l-45 4c-62 5-116-43-119-105l-13-261c-3-51 12-90 37-115Z"/>
    <path fill="#FFB354" fill-opacity="0.29" d="M299 464c36-17 79-18 122-10-46 118-56 277-33 438-48-3-84-41-87-89l-12-241c-2-42 1-76 10-98Z"/>
    <path fill="none" stroke="#FFE0A0" stroke-width="8" stroke-linecap="round" stroke-dasharray="14 15" d="M296 539 307 797c3 57 48 96 102 92l25-2c52-4 94-42 106-93l58-245"/>

    <!-- Retention flap -->
    <g transform="translate(8 18)" filter="url(#flapShadow4)">
      <path fill="#79251A" d="M542 467c40-42 100-58 155-40l71 23-31 177c-5 28-28 49-56 53l-118 15c-49 6-90-37-80-85l15-76c6-28 20-50 44-67Z"/>
      <path fill="url(#leather4)" d="M533 452c39-39 96-53 149-36l69 22-28 166c-4 25-25 44-50 47l-109 14c-45 6-83-34-74-78l14-69c5-26 15-48 29-66Z"/>
      <path fill="none" stroke="#FFD893" stroke-width="7" stroke-linecap="round" stroke-dasharray="13 14" d="M548 484c29-25 68-34 104-22l52 17-18 108c-2 11-11 20-23 21l-82 10c-26 3-47-20-42-45l11-55"/>
      <circle cx="634" cy="552" r="44" fill="#693018" fill-opacity="0.58"/>
      <circle cx="628" cy="542" r="38" fill="url(#brass4)"/>
      <circle cx="616" cy="530" r="11" fill="#FFF3AB" fill-opacity="0.68"/>
    </g>
  </g>
</svg>
